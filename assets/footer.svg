<svg width="1200" height="160" viewBox="0 0 1200 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05060a"/>
      <stop offset="100%" stop-color="#0a0f1f"/>
    </linearGradient>
    <linearGradient id="footLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <filter id="footGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="160" fill="url(#footBg)"/>
  <rect x="0" y="0" width="1200" height="3" fill="url(#footLine)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>

  <circle cx="150" cy="40" r="70" fill="#7C3AED" opacity="0.08">
    <animate attributeName="cy" values="40;20;40" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="120" r="80" fill="#00F7FF" opacity="0.08">
    <animate attributeName="cy" values="120;100;120" dur="7s" repeatCount="indefinite"/>
  </circle>

  <text x="600" y="70" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="url(#footLine)" filter="url(#footGlow)">
    &#8226; Designed, deployed &amp; automated by S. Madesh &#8226;
  </text>
  <text x="600" y="102" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#6b7a90">
    "Infrastructure is code. Reliability is a habit."
  </text>

  <g font-family="Consolas, monospace" font-size="13" fill="#22C55E">
    <text x="600" y="134" text-anchor="middle">
      status: online
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite"/>
    </text>
  </g>

  <circle cx="470" cy="130" r="5" fill="#22C55E">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
</svg>
