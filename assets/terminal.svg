<svg width="760" height="360" viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#0d1420"/>
    </linearGradient>
    <filter id="termGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="752" height="352" rx="16" fill="url(#termBg)" stroke="#00F7FF" stroke-opacity="0.35" stroke-width="1.4"/>
  <rect x="4" y="4" width="752" height="40" rx="16" fill="#111726"/>
  <rect x="4" y="28" width="752" height="16" fill="#111726"/>

  <circle cx="30" cy="24" r="6" fill="#ff5f57"/>
  <circle cx="52" cy="24" r="6" fill="#febc2e"/>
  <circle cx="74" cy="24" r="6" fill="#28c840"/>
  <text x="380" y="29" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#6b7a90">madesh@devops-lab: ~</text>

  <g font-family="Consolas, 'Courier New', monospace" font-size="15">
    <text x="24" y="80" fill="#22C55E">madesh@devops-lab</text>
    <text x="188" y="80" fill="#e5f9ff">:~$ whoami</text>

    <text x="24" y="106" fill="#00F7FF" opacity="0">
      S. Madesh — Aspiring DevOps &amp; Cloud Engineer
      <animate attributeName="opacity" begin="0.6s" dur="0.4s" to="1" fill="freeze"/>
    </text>

    <text x="24" y="140" fill="#22C55E" opacity="0">
      madesh@devops-lab
      <animate attributeName="opacity" begin="1.6s" dur="0.3s" to="1" fill="freeze"/>
    </text>
    <text x="188" y="140" fill="#e5f9ff" opacity="0">
      :~$ cat current_focus.txt
      <animate attributeName="opacity" begin="1.6s" dur="0.3s" to="1" fill="freeze"/>
    </text>

    <text x="24" y="166" fill="#9fb4c9" opacity="0">
      Learning: Linux &#183; Docker &#183; Kubernetes &#183; AWS &#183; Terraform &#183; CI/CD
      <animate attributeName="opacity" begin="2.4s" dur="0.4s" to="1" fill="freeze"/>
    </text>

    <text x="24" y="200" fill="#22C55E" opacity="0">
      madesh@devops-lab
      <animate attributeName="opacity" begin="3.2s" dur="0.3s" to="1" fill="freeze"/>
    </text>
    <text x="188" y="200" fill="#e5f9ff" opacity="0">
      :~$ ./deploy.sh --env production
      <animate attributeName="opacity" begin="3.2s" dur="0.3s" to="1" fill="freeze"/>
    </text>

    <text x="24" y="226" fill="#7C3AED" opacity="0">
      [+] Building containers... done
      <animate attributeName="opacity" begin="4s" dur="0.3s" to="1" fill="freeze"/>
    </text>
    <text x="24" y="248" fill="#7C3AED" opacity="0">
      [+] Provisioning infra with Terraform... done
      <animate attributeName="opacity" begin="4.5s" dur="0.3s" to="1" fill="freeze"/>
    </text>
    <text x="24" y="270" fill="#22C55E" opacity="0" filter="url(#termGlow)">
      [&#10003;] Deployment successful — 0 downtime
      <animate attributeName="opacity" begin="5s" dur="0.4s" to="1" fill="freeze"/>
    </text>

    <text x="24" y="304" fill="#22C55E" opacity="0">
      madesh@devops-lab
      <animate attributeName="opacity" begin="5.8s" dur="0.3s" to="1" fill="freeze"/>
    </text>
    <text x="188" y="304" fill="#e5f9ff" opacity="0">
      :~$ echo "Let's build something great."
      <animate attributeName="opacity" begin="5.8s" dur="0.3s" to="1" fill="freeze"/>
    </text>
  </g>

  <rect x="24" y="316" width="10" height="18" fill="#00F7FF">
    <animate attributeName="opacity" values="1;0;1" dur="1s" begin="6.2s" repeatCount="indefinite"/>
  </rect>
</svg>
