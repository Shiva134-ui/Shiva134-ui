<svg width="1200" height="380" viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05060a">
        <animate attributeName="stop-color" values="#05060a;#0a0f1f;#05060a" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#0d1224">
        <animate attributeName="stop-color" values="#0d1224;#141b3a;#0d1224" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#05060a">
        <animate attributeName="stop-color" values="#05060a;#0a0f1f;#05060a" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF"/>
      <stop offset="55%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>

    <linearGradient id="cyanPurpleAnim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF">
        <animate attributeName="offset" values="-0.3;1;-0.3" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#7C3AED">
        <animate attributeName="offset" values="0.2;1.5;0.2" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#22C55E">
        <animate attributeName="offset" values="0.7;2;0.7" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00F7FF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>

    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="380" fill="url(#bgGrad)"/>
  <rect width="1200" height="380" fill="url(#grid)"/>

  <!-- floating orbs -->
  <circle cx="120" cy="80" r="90" fill="#00F7FF" opacity="0.08" filter="url(#softGlow)">
    <animate attributeName="cy" values="80;110;80" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="300" r="120" fill="#7C3AED" opacity="0.10" filter="url(#softGlow)">
    <animate attributeName="cy" values="300;260;300" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="60" r="60" fill="#22C55E" opacity="0.09" filter="url(#softGlow)">
    <animate attributeName="cx" values="980;1020;980" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- circuit lines -->
  <g stroke="url(#cyanPurple)" stroke-width="1.4" opacity="0.35" fill="none">
    <path d="M0,340 L200,340 L230,310 L420,310">
      <animate attributeName="opacity" values="0.15;0.5;0.15" dur="3.5s" repeatCount="indefinite"/>
    </path>
    <path d="M1200,40 L980,40 L950,70 L760,70">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.5s" repeatCount="indefinite"/>
    </path>
  </g>
  <circle cx="230" cy="310" r="4" fill="#00F7FF">
    <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="950" cy="70" r="4" fill="#7C3AED">
    <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- glass panel -->
  <rect x="60" y="70" width="1080" height="240" rx="22" fill="#ffffff" opacity="0.03"/>
  <rect x="60" y="70" width="1080" height="240" rx="22" fill="none" stroke="url(#cyanPurpleAnim)" stroke-width="1.6" opacity="0.7"/>

  <!-- kicker -->
  <text x="600" y="120" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="16" letter-spacing="6" fill="#22C55E" opacity="0.9">
    root@devops-engineer:~$ whoami
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/>
  </text>

  <!-- Name -->
  <text x="600" y="188" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="58" font-weight="800" fill="url(#cyanPurpleAnim)" filter="url(#glow)">
    S. MADESH
  </text>

  <!-- Role -->
  <text x="600" y="228" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="21" fill="#e5f9ff">
    <tspan fill="#00F7FF">Aspiring</tspan> DevOps &amp; Cloud Engineer
  </text>

  <!-- typing subtext with blinking cursor -->
  <text x="600" y="264" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#9fb4c9">
    Automating Infrastructure &#183; Building Cloud-Native Systems &#183; Shipping CI/CD Pipelines
  </text>
  <rect x="915" y="250" width="10" height="18" fill="#00F7FF">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- tag pills -->
  <g font-family="Consolas, monospace" font-size="13" font-weight="600">
    <rect x="380" y="278" width="88" height="26" rx="13" fill="#00F7FF" opacity="0.12" stroke="#00F7FF" stroke-opacity="0.6"/>
    <text x="424" y="295" text-anchor="middle" fill="#00F7FF">LINUX</text>

    <rect x="478" y="278" width="88" height="26" rx="13" fill="#7C3AED" opacity="0.15" stroke="#7C3AED" stroke-opacity="0.6"/>
    <text x="522" y="295" text-anchor="middle" fill="#c9a6ff">DOCKER</text>

    <rect x="576" y="278" width="108" height="26" rx="13" fill="#22C55E" opacity="0.12" stroke="#22C55E" stroke-opacity="0.6"/>
    <text x="630" y="295" text-anchor="middle" fill="#22C55E">KUBERNETES</text>

    <rect x="694" y="278" width="82" height="26" rx="13" fill="#00F7FF" opacity="0.12" stroke="#00F7FF" stroke-opacity="0.6"/>
    <text x="735" y="295" text-anchor="middle" fill="#00F7FF">AWS</text>
  </g>

  <rect width="1200" height="380" fill="url(#vignette)"/>
</svg>
