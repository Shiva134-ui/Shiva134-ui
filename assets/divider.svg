<svg width="1200" height="60" viewBox="0 0 1200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0f1f" stop-opacity="0"/>
      <stop offset="15%" stop-color="#00F7FF"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="85%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#0a0f1f" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <line x1="0" y1="30" x2="1200" y2="30" stroke="url(#divGrad)" stroke-width="2" opacity="0.55"/>

  <circle cx="0" cy="30" r="5" fill="#00F7FF">
    <animate attributeName="cx" values="0;1200;0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#00F7FF;#7C3AED;#22C55E;#00F7FF" dur="4s" repeatCount="indefinite"/>
  </circle>

  <g font-family="Consolas, monospace" font-size="14" fill="#00F7FF">
    <rect x="560" y="10" width="80" height="24" rx="12" fill="#0a0f1f" stroke="#00F7FF" stroke-opacity="0.5"/>
