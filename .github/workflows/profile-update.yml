name: Profile Auto-Refresh

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update last-refreshed timestamp
        run: |
          TIMESTAMP=$(TZ="Asia/Kolkata" date "+%Y-%m-%d %H:%M IST")
          if [ -f README.md ]; then
            if grep -q "<!--LAST_REFRESH-->" README.md; then
              sed -i "s|<!--LAST_REFRESH-->.*<!--END_LAST_REFRESH-->|<!--LAST_REFRESH-->${TIMESTAMP}<!--END_LAST_REFRESH-->|" README.md
            fi
          fi

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: auto-refresh profile timestamp [skip ci]"
          git push
